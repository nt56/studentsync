name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded pull request runs only; a run on main may be mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A throwaway plain mongod, the same shape as production (no replica set).
    # It exists only for this job and is not the project's database.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The integration runner uses the service container instead of downloading mongod.
      MONGOMS_DISABLE_POSTINSTALL: "1"
      INTEGRATION_MONGODB_URI: mongodb://127.0.0.1:27017/studentsync_integration_ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit and contract tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder only; the build never connects.
          MONGODB_URI: mongodb://placeholder:27017/studentsync
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Integration tests (plain mongod)
        run: npm run test:integration

  # Catches Dockerfile breakage. Builds the image only; nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t studentsync:ci .

  # Continuous deployment: only on pushes to main, and only after `verify` passes.
  # Render's own auto-deploy must be set to "Off" (or "After CI checks pass"),
  # otherwise Render also deploys on every push and this job duplicates it.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set"; exit 1
          fi
          # ref pins the deploy to the commit that passed CI.
          curl --fail --silent --show-error --retry 3 -X POST "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA" > /dev/null
          echo "Deploy triggered for ${GITHUB_SHA::7}"

      # Optional: set the repo variable RENDER_APP_URL (e.g. https://yourapp.onrender.com)
      # to wait until /api/health reports this commit (the old version keeps
      # serving while the new one builds, so a plain 200 proves nothing).
      - name: Wait for the new version
        if: vars.RENDER_APP_URL != ''
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          for i in $(seq 1 60); do
            body=$(curl -s --max-time 20 "${APP_URL%/}/api/health" || true)
            if echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              echo "Live: ${GITHUB_SHA::7}"; exit 0
            fi
            echo "attempt $i: not live yet"
            sleep 15
          done
          echo "::error::${GITHUB_SHA::7} did not become healthy in time; check the Render logs"
          exit 1
